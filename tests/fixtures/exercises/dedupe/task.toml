[[known_bad]]
id = "mutates_the_input"
trap = "deduplicates in place, so the caller's list is destroyed"
files."solution.py" = """
def dedupe(xs):
    seen = set()
    i = 0
    while i < len(xs):
        if xs[i] in seen:
            del xs[i]
        else:
            seen.add(xs[i])
            i += 1
    return xs
"""
